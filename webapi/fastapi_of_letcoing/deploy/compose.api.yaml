services:
  migrate:
    image: "${API_IMAGE:?Set immutable API image digest}"
    env_file: ../.env.production
    environment:
      API_IMAGE: "${API_IMAGE:?Set immutable API image digest}"
      JUDGE_SANDBOX_IMAGE: "${JUDGE_SANDBOX_IMAGE:?Set immutable sandbox image digest}"
    command: [sh, -c, 'python deploy/check_release.py --role api && python manage.py migrate']
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - "/tmp:size=128m,mode=1777"
  api:
    depends_on:
      migrate:
        condition: service_completed_successfully
    image: "${API_IMAGE:?Set immutable API image digest}"
    restart: unless-stopped
    env_file: ../.env.production
    environment:
      JUDGE_SANDBOX_IMAGE: "${JUDGE_SANDBOX_IMAGE:?Set immutable sandbox image digest}"
      DB_MIGRATION_MODE: check
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    command: [sh, -c, 'mkdir -p /tmp/prometheus && exec python -m deploy.start_api']
    # 默认只监听本机 8080；与 LuckyVerify 一样可通过 LISTEN_ADDRESS / APP_PORT 覆盖。
    ports: ["${LISTEN_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - "/tmp:size=256m,mode=1777"
    volumes:
      - /var/lib/letcoding/uploads:/var/lib/letcoding/uploads
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    stop_grace_period: 45s
