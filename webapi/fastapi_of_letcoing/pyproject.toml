[project]
name = "letcoding-api"
version = "0.1.0"
description = "LetCoding 后端：Flask + Flask-RESTX 判题 API"
readme = "README.md"
requires-python = ">=3.13"

# 直接依赖精确钉版；间接依赖由 uv.lock 锁定。升级走 `uv lock --upgrade`。
dependencies = [
    "aiohttp==3.14.3",
    "authlib==1.6.12",
    "cryptography==50.0.0",
    "flask==3.1.3",
    "flask-restx==1.3.2",
    "gunicorn==23.0.0",
    "peewee==3.18.3",
    "pillow==12.3.0",
    "prometheus-client==0.26.0",
    "psycopg2-binary==2.9.10",
    "pyjwt==2.13.0",
    "python-dotenv==1.2.2",
    "redis==5.2.1",
    "requests==2.33.0",
    "werkzeug==3.1.6"
]

[dependency-groups]
dev = [
    "pytest==9.1.1"
]

[tool.uv]
# 应用而非库：不构建、不安装项目自身。
package = false

# 原 requirements.txt（pip freeze 产物）里间接引入的版本，逐条约束以精确复现上线前已验证、
# 已通过 pip-audit 的依赖集合。要整体前移时删掉本节再执行 `uv lock --upgrade`。
constraint-dependencies = [
    "aiohappyeyeballs==2.6.1",
    "aiosignal==1.4.0",
    "aniso8601==10.0.1",
    "attrs==25.4.0",
    "blinker==1.9.0",
    "certifi==2025.11.12",
    "cffi==2.0.0",
    "charset-normalizer==3.4.4",
    "click==8.3.3",
    "frozenlist==1.8.0",
    "idna==3.15",
    "importlib_resources==6.5.2",
    "itsdangerous==2.2.0",
    "Jinja2==3.1.6",
    "jsonschema==4.25.1",
    "jsonschema-specifications==2025.9.1",
    "MarkupSafe==3.0.3",
    "multidict==6.7.0",
    "propcache==0.4.1",
    "pycparser==2.23",
    "referencing==0.37.0",
    "rpds-py==0.30.0",
    "urllib3==2.7.0",
    "yarl==1.22.0"
]
