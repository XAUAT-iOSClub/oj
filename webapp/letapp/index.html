<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <script src="/startup.js"></script>
    <script>
      // 首屏前应用主题偏好，避免浅色/深色切换闪烁。
      (function () {
        try {
          var stored = localStorage.getItem('appThemePreference');
          var preference =
            stored === 'light' || stored === 'dark' || stored === 'system'
              ? stored
              : 'light';
          var dark =
            preference === 'dark' ||
            (preference === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (error) {
          /* 隐私模式下 web storage 不可用，保持默认浅色 */
        }
      })();
    </script>
    <link rel="dns-prefetch" href="https://glot.io" />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="preload" href="/assets/favicon.png" as="image" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="theme-color" content="#f6f7f9" />
    <title>Let Coding - 西建大 iOS Club 出品</title>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
