name: Backend reliability and isolation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: reliability-${{ github.workflow }}-${{ github.ref }}
  # 发布 job 与验收共用一个 workflow；不要因后续 push 取消正在发布的镜像。
  cancel-in-progress: false
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: webapi/fastapi_of_letcoing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install backend system dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y \
            redis-server postgresql openjdk-17-jdk prometheus
      - run: promtool check rules deploy/alerts.yaml && promtool test rules deploy/alerts.test.yaml
      - run: pip install uv==0.10.7
      - run: uv sync --frozen
      # 审计对象是锁定的生产依赖集，dev 依赖不参与。
      - run: uv export --frozen --no-dev --no-emit-project --no-hashes -o /tmp/production-requirements.txt
      - run: pip install pip-audit && pip-audit -r /tmp/production-requirements.txt
      - run: echo "PG_BINDIR=$(pg_config --bindir)" >> "$GITHUB_ENV"
      - run: uv run --frozen python -m pytest -q --junitxml=backend-results.xml
      - run: docker build -f Dockerfile.sandbox -t letcoding-sandbox:local .
      - run: uv run --frozen python -m pytest tests/sandbox_integration.py -q --junitxml=sandbox-results.xml
      - run: docker build -t letcoding-api:local .
      - run: docker build -f Dockerfile.worker -t letcoding-worker:local .
      - name: Preserve backend acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-acceptance-${{ github.sha }}
          path: webapi/fastapi_of_letcoing/*-results.xml
          retention-days: 14
  frontend-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: webapp/letapp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/letapp/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - name: Install Playwright Chromium
        timeout-minutes: 15
        run: |
          npx playwright install --with-deps chromium \
            || { sleep 15; npx playwright install --with-deps chromium; }
      - run: npm run build
      - run: node scripts/check-bundle.mjs
      - run: node scripts/check-production.mjs
      - run: npx playwright test

  release-gate:
    name: Required release gate
    needs: [backend, frontend-contract]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all acceptance jobs
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend-contract.result }}
        run: test "$BACKEND_RESULT" = success && test "$FRONTEND_RESULT" = success

  publish-images:
    name: Build and push backend images
    needs: [release-gate]
    if: >-
      needs.release-gate.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-images
      cancel-in-progress: false
    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository }}
      RELEASE_SHA: ${{ github.sha }}
    defaults:
      run:
        working-directory: webapi/fastapi_of_letcoing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - name: Resolve image names
        id: image
        shell: bash
        run: |
          prefix="$(echo "$IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]')"
          {
            echo "api=${prefix}-api"
            echo "worker=${prefix}-worker"
            echo "sandbox=${prefix}-sandbox"
          } >> "$GITHUB_OUTPUT"
      - name: Sign in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build and push sandbox image
        timeout-minutes: 20
        run: |
          image="${{ steps.image.outputs.sandbox }}"
          docker build -f Dockerfile.sandbox -t "$image:${RELEASE_SHA}" -t "$image:latest" .
          docker push "$image:${RELEASE_SHA}"
          docker push "$image:latest"
      - name: Build and push API image
        timeout-minutes: 25
        run: |
          image="${{ steps.image.outputs.api }}"
          docker build -t "$image:${RELEASE_SHA}" -t "$image:latest" .
          docker push "$image:${RELEASE_SHA}"
          docker push "$image:latest"
          docker tag "$image:${RELEASE_SHA}" letcoding-api:local
      - name: Build and push Worker image
        timeout-minutes: 20
        run: |
          image="${{ steps.image.outputs.worker }}"
          docker build -f Dockerfile.worker -t "$image:${RELEASE_SHA}" -t "$image:latest" .
          docker push "$image:${RELEASE_SHA}"
          docker push "$image:latest"

  promote-production:
    name: Promote verified commit to production
    needs: [release-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_PRODUCTION_PROMOTION == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    concurrency:
      group: production-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Fast-forward production only after every acceptance job passed
        env:
          ACCEPTED_SHA: ${{ github.sha }}
        run: python3 webapi/fastapi_of_letcoing/deploy/promote_release.py --sha "$ACCEPTED_SHA"

  deploy-api:
    name: Deploy API over SSH
    needs: [publish-images]
    if: >-
      needs.publish-images.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      # scp-action 从工作区打包文件，部署 job 必须先 checkout。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve deployment image prefix
        id: image
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      # 与 LuckyVerify 一致：只在 SSH 相关 secrets 齐全时部署；缺失时只推送镜像并给出提示，
      # 不把未配置的仓库视为失败，也不会用空 key 去尝试连接。
      # secrets 在 job 级 if 中不可用，因此把探测放在步骤内，依赖 environment 读取环境级 secrets。
      - name: Detect SSH deployment secrets
        id: detect
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [[ -n "$SSH_HOST" && -n "$SSH_USER" && -n "$SSH_PRIVATE_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=跳过自动部署::未配置 SSH_HOST / SSH_USER / SSH_PRIVATE_KEY；镜像已推送，可继续按 README 手动部署。"
          fi
      - name: Create deployment directory
        if: steps.detect.outputs.enabled == 'true'
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || 22 }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          script: mkdir -p ~/letcoding
      # 只同步 deploy/ 目录；~/.env.production 含密钥，由运维在服务器上自行维护，绝不经过工作流。
      - name: Upload deployment definitions
        if: steps.detect.outputs.enabled == 'true'
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || 22 }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          source: webapi/fastapi_of_letcoing/deploy
          target: ~/letcoding
          strip_components: 2
      - name: Pull and restart API
        if: steps.detect.outputs.enabled == 'true'
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        env:
          IMAGE_PREFIX: ${{ steps.image.outputs.prefix }}
          IMAGE_TAG: ${{ github.sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || 22 }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          envs: IMAGE_PREFIX,IMAGE_TAG,REGISTRY_USER,REGISTRY_TOKEN
          command_timeout: 30m
          script: |
            set -eu
            cd ~/letcoding/deploy
            # 脚本自行解析不可变摘要、登录/登出 GHCR，并在 /readyz 就绪后才返回成功。
            export IMAGE_PREFIX IMAGE_TAG
            export PULL_USERNAME="$REGISTRY_USER"
            export PULL_TOKEN="$REGISTRY_TOKEN"
            bash ./deploy_from_ghcr.sh api "$IMAGE_TAG"
