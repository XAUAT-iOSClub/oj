name: Publish backend images

# 发布镜像的前提是 backend.yml（name 必须与下面 workflow_run.workflows 完全一致）
# 的全部验收任务成功。单独成一个工作流而不是加进 backend.yml，是为了避开后者
# 顶层的 concurrency cancel-in-progress: true —— 那个策略对新提交的体验很好，
# 但如果发布任务也在同一个 run 里，新一次 push 会把正在推镜像的 run 直接取消。
on:
  workflow_run:
    workflows: ["Backend reliability and isolation"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images
  cancel-in-progress: false

env:
  # GHCR 仓库名必须全小写；$GITHUB_REPOSITORY 里的 org 大小写不固定。
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Build and push images
    # workflow_run 的 head_branch 是触发 run 的分支：PR 分支和功能分支在这里被过滤掉。
    # 手动触发（workflow_dispatch）不受此限制。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    # 冷缓存下三个镜像（尤其 Sandbox 的 g++/JDK/Go 层）约 20-30 分钟。
    timeout-minutes: 60
    env:
      # workflow_run 事件里的 GITHUB_SHA 是默认分支的 tip，不是被验收的提交；
      # 镜像 tag 必须跟 checkout 的 ref 用同一个来源，否则 tag 会指错提交。
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    defaults:
      run:
        working-directory: webapi/fastapi_of_letcoing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 必须构建被验收的那个提交，而不是默认分支的 HEAD。
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Resolve image names
        id: image
        shell: bash
        run: |
          prefix="$(echo "$IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]')"
          {
            echo "api=${prefix}-api"
            echo "worker=${prefix}-worker"
            echo "sandbox=${prefix}-sandbox"
          } >> "$GITHUB_OUTPUT"
      # 不用 docker/login-action：本仓库的第三方 action 都按 Commit SHA 固定，
      # docker login 用 CLI 就够，少一个需要跟踪的 pin。
      - name: Sign in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build and push sandbox image
        timeout-minutes: 20
        run: |
          image="${{ steps.image.outputs.sandbox }}"
          docker build -f Dockerfile.sandbox -t "$image:${RELEASE_SHA}" -t "$image:latest" .
          docker push "$image:${RELEASE_SHA}"
          docker push "$image:latest"
      - name: Build and push API image
        timeout-minutes: 25
        run: |
          image="${{ steps.image.outputs.api }}"
          docker build -t "$image:${RELEASE_SHA}" -t "$image:latest" .
          docker push "$image:${RELEASE_SHA}"
          docker push "$image:latest"
          # Dockerfile.worker 以 letcoding-api:local 为基座；这里直接复用刚构建的
          # API 镜像，避免为了给 Worker 打基座再从 registry 拉回同一份。
          docker tag "$image:${RELEASE_SHA}" letcoding-api:local
      - name: Build and push Worker image
        timeout-minutes: 20
        run: |
          image="${{ steps.image.outputs.worker }}"
          docker build -f Dockerfile.worker -t "$image:${RELEASE_SHA}" -t "$image:latest" .
          docker push "$image:${RELEASE_SHA}"
          docker push "$image:latest"
